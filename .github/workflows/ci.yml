name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_USER: ems_test
          POSTGRES_PASSWORD: ems_test_password
          POSTGRES_DB: ems_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U ems_test -d ems_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7.0.1

      - name: Setup Node.js
        uses: actions/setup-node@v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Configure test environment
        run: |
          cat > .env.test <<'EOF'
          NODE_ENV=test
          PORT=3001
          POSTGRES_HOST=127.0.0.1
          POSTGRES_PORT=5432
          POSTGRES_USER=ems_test
          POSTGRES_PASSWORD=ems_test_password
          POSTGRES_DB=ems_test
          SESSION_SECRET=ci-test-session-secret-at-least-32-characters-long
          SESSION_COOKIE_SECURE=false
          SESSION_MAX_AGE_HOURS=1
          BCRYPT_COST=10
          WEB_ORIGIN=http://localhost:5173
          EOF

      - name: Automated API tests
        run: npm test

      - name: Lint
        run: npm run lint

      - name: Type check
        run: npm run typecheck

      - name: Build
        run: npm run build

      - name: Workers runtime smoke tests
        run: npm run test:worker

      - name: Workers bundle dry run
        run: npm run build:worker

  deploy:
    name: Deploy DUMB-EMS
    needs: verify
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest

    concurrency:
      group: dumb-ems-production
      cancel-in-progress: false

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7.0.1

      - name: Setup Node.js
        uses: actions/setup-node@v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build Cloudflare frontend
        run: npm run build:worker --workspace=@ems/web

      - name: Deploy to Cloudflare Workers
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: deploy --config apps/api/worker/wrangler.jsonc
