server {
    listen 8080;
    server_tokens off;
    error_page 500 502 503 504 =503 /service-unavailable;
    error_page 413 =413 /file-too-large;

    location = /service-unavailable {
        internal;
        default_type application/json;
        return 503 '{"error":{"message":"Something went wrong. Please try again. If the problem continues, contact your administrator."}}';
    }
    location = /file-too-large {
        internal;
        default_type application/json;
        return 413 '{"error":{"message":"Please choose a smaller file and try again."}}';
    }
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Profile photos are limited to 5 MB by the API; leave headroom for request overhead.
    client_max_body_size 6m;

    location /api/ {
        proxy_intercept_errors on;
        proxy_pass http://api:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
